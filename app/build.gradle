plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.siva.magnifyapp'
    compileSdk 36 // Note: Changed to 35 (Stable) unless you specifically installed 36

    defaultConfig {
        applicationId "com.siva.magnifyapp"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.core.ktx

    // --- RAYNEO SDK ---
    implementation files('libs/MercuryAndroidSDK-v0.2.3-20260104184638_9002bcc8.aar')

    // --- REQUIRED FIX FOR CRASH ---
    // These 3 lines fix the "NoClassDefFoundError: ViewModelKt" crash
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}