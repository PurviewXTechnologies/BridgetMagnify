plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

// Load keys from local.properties (git-ignored)
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) localProps.load(localPropsFile.newDataInputStream())

android {
    namespace 'com.shashi.rayneomagnify'
    compileSdk 36 // Note: Changed to 35 (Stable) unless you specifically installed 36

    defaultConfig {
        applicationId "com.shashi.rayneomagnify"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Inject API keys from local.properties into BuildConfig
        buildConfigField "String", "GEMINI_API_KEY",       "\"${localProps.getProperty('GEMINI_API_KEY', '')}\""
        buildConfigField "String", "ELEVENLABS_API_KEY",   "\"${localProps.getProperty('ELEVENLABS_API_KEY', '')}\""
        buildConfigField "String", "ELEVENLABS_VOICE_ID",  "\"${localProps.getProperty('ELEVENLABS_VOICE_ID', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true   // required to generate BuildConfig class
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.core.ktx

    // --- RAYNEO SDK ---
    // Updated to 0.2.5
    implementation files('libs/MercuryAndroidSDK-v0.2.5-20260212110627_ceaebc13.aar')

    // --- REQUIRED FIX FOR CRASH ---
    // These 3 lines fix the "NoClassDefFoundError: ViewModelKt" crash
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    
    // --- ML Kit Text Recognition ---
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // --- Gemini SDK ---
    implementation "com.google.ai.client.generativeai:generativeai:0.9.0"

    // --- OkHttp (ElevenLabs TTS API) ---
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}